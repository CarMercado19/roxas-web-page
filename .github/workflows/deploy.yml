name: Deploy to GitHub Pages

on:
  # Permite que el flujo se ejecute manualmente desde GitHub Actions.
  workflow_dispatch:

  # Ejecuta automáticamente el despliegue solo cuando se haga push a la rama `master`.
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Configure Git with token
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config --global url."https://x-access-token:${{ secrets.ROXAS_PAGE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: yarn install

      - name: Build the project
        run: yarn build

      - name: Deploy to GitHub Pages
        env:
          ROXAS_PAGE_TOKEN: ${{ secrets.ROXAS_PAGE_TOKEN }}  # Usar el token personalizado
        run: yarn deploy
